[package]
name = "ersa_lsp_core"
license = "GPL-3.0-or-later"
description = "LSP core for the GPC Scripting language."
repository = "https://github.com/zkiwiko/ersa-lsp-core"
version = "0.3.1"
edition = "2021"

[lib]
name = "ersa_lsp_core"
path = "src/lib.rs"

[[bin]]
name = "ersa_lsp"
path = "src/bin/main.rs"
test = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-lsp = "0.20.0"
tree-sitter = "0.26.3"

[build-dependencies]
cc = "1.2.52"
