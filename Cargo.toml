[package]
name = "ersa_lsp_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ersa_lsp_core"
path = "src/lib.rs"

# Strictly for development purposes.
# Use github.com/zkiwiko/ersa-lsp for production binaries.
[[bin]]
name = "ersa_lsp"
path = "src/bin/main.rs"
test = false

[dependencies]
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-lsp = "0.20.0"
tree-sitter = "0.26.3"

[build-dependencies]
cc = "1.2.52"
